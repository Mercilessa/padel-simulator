[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18.17.0"

# Needed for Netlify Edge Functions
[functions]
  included_files = [".next/server/**", ".next/static/**"]

# This redirect ensures that all routes are handled by Next.js
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/nextjs-server"
  status = 200
