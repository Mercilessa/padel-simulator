[build]
  base = "my-app"
  command = "npm run build"
  publish = ".next"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./my-app/"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "22.13.1"
  NEXT_PUBLIC_URL = "/"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["my-app/.next/server/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/nextjs-server"
  status = 200
